buildscript {
    ext.kotlin_version = '2.0.0'
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath "org.tomlj:tomlj:1.1.1"
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath 'com.google.code.gson:gson:2.8.9'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "dev.architectury.loom" version "1.4-SNAPSHOT"
    id 'maven-publish'
    id("org.moddedmc.wiki.toolkit") version "0.2.7"
}

apply plugin: 'idea'
apply plugin: 'kotlin'

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'com.google.code.gson' && details.requested.name == 'gson') {
            details.useVersion '2.8.9'
            details.because 'Avoid Gson reflection issues'
        }
    }
}

// Load properties from build.txt
apply from: 'gradle/template-config.gradle'

def hasModrinthTarget = !project.ext.template.modrinthProject.isBlank()
def hasCurseforgeTarget = project.ext.template.curseforgeProject > 0L
def modrinthUploadTaskName = 'uploadModrinth'
def curseforgeUploadTaskName = 'uploadCurseForge'

wiki {
    // The name of the object (examplemod) should match the registered wiki project ID (if it exists).
    docs.create("pmmojs") {
        // The path to the folder containing the documentation metadata file (sinytra-wiki.json)
        root = file("docs/")
    }
}

version = config.mod_version
group = config.maven_group
base {
    archivesName = "${config.archive_name}-${config.mc_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

loom {
    silentMojangMappingsLicense()

    runs {
        client {
            client()
            setConfigName("Minecraft Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Minecraft Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }

    forge {
        mixinConfigs = [
                "mixins.${config.mod_id}.json"
        ]
    }
}

repositories {
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }

    maven {
        name = "MinecraftForge"
        url "https://maven.minecraftforge.net/"
    }

    maven {
        name = "Lat's Maven"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        name = "Curseforge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Mihono's maven"
        url = "https://maven.mihono.cn/repository/pickaid1201/"
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    repositories {
        maven { url "https://maven.shedaniel.me/" }
    }
    repositories {
        maven {
            name 'Xander Maven'
            url 'https://maven.isxander.dev/releases'
        }
    }
    flatDir { dirs "libraries/${config.mc_version}/all" }
    flatDir { dirs "libraries/${config.mc_version}/classpathOnly" }
    flatDir { dirs "libraries/${config.mc_version}/runtimeOnly" }
    flatDir { dirs "libraries/embedded" }
    mavenCentral()
}

dependencies {
    def probejsRuntime = (findProperty("probejsRuntime") ?: "modern").toString().toLowerCase()
    def probejsRuntimeOptions = ["modern", "probejs", "regular", "legacy", "probejs_legacy", "none"]
    if (!probejsRuntimeOptions.contains(probejsRuntime)) {
        throw new GradleException("Unsupported probejsRuntime '${probejsRuntime}'. Use modern, legacy, or none.")
    }

    minecraft "com.mojang:minecraft:${config.mc_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
    }
    forge("net.minecraftforge:forge:${config.mc_version}-${config.forge_version}")
    def addTemplateDependency = { Map<String, Object> dependencySpec ->
        if (dependencySpec.name == "probejs" && dependencySpec.configuration == "modRuntimeOnly" && !(["modern", "probejs", "regular"].contains(probejsRuntime))) {
            return
        }
        if (dependencySpec.name == "probejs_legacy" && dependencySpec.configuration == "modRuntimeOnly" && !(["legacy", "probejs_legacy"].contains(probejsRuntime))) {
            return
        }

        def dependency = project.dependencies.create(dependencySpec.notation as String) {
            transitive = dependencySpec.transitive
        }
        switch (dependencySpec.configuration) {
            case "modImplementation":
                modImplementation(dependency)
                break
            case "modCompileOnly":
                modCompileOnly(dependency)
                break
            case "modRuntimeOnly":
                modRuntimeOnly(dependency)
                break
            case "modInclude":
                implementation(include(dependency))
                break
            default:
                throw new GradleException("Unsupported PmmoJS dependency configuration: ${dependencySpec.configuration}")
        }
    }

    project.ext.templateDependencies.each(addTemplateDependency)

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.2"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.3.2"))
//    modCompileOnly("curse.maven:configured-457570:5180900")
//    modRuntimeOnly("curse.maven:configured-457570:5180900")


    // Dynamic library loading
    def libraries = new File(file("libraries"), "${config.mc_version}")
    if (!libraries.isDirectory()) libraries.mkdirs()

    // All libraries
    def libDir = new File(libraries, "all")
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            modImplementation(project.dependencies.create("_all:$modartifact:$modversion") {
                transitive = false
            })
        }
    } else libDir.mkdir()

    // Classpath only libraries
    libDir = new File(libraries, "classpathOnly")
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            modCompileOnly(project.dependencies.create("_classpath:$modartifact:$modversion") {
                transitive = false
            })
        }
    } else libDir.mkdir()

    // Runtime only libraries
    libDir = new File(libraries, "runtimeOnly")
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            modRuntimeOnly(project.dependencies.create("_runtime:$modartifact:$modversion") {
                transitive = false
            })
        }
    } else libDir.mkdir()

    // Embedded libraries
    libDir = new File(file("libraries"), "embedded")
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            implementation(include(project.dependencies.create("lib:$modartifact:$modversion") {
                transitive = false
            }))
        }
    } else libDir.mkdir()
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
}

processResources {
    def dependencyVersion = { String name ->
        def dependencySpec = project.ext.templateDependencies.find { it.name == name }
        dependencySpec == null ? "" : dependencySpec.version
    }
    def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
    def replaceProperties = [
            version: config.mod_version,
            mod_version: config.mod_version,
            minecraft_version: config.mc_version,
            minecraft_version_range: config.mc_range,
            forge_version: config.forge_version,
            forge_version_range: config.forge_range,
            loader_version_range: config.forge_range,
            mod_id: config.mod_id,
            mod_name: config.mod_name,
            mod_license: config.mod_license,
            mod_authors: config.mod_authors,
            mod_description: config.mod_description?.replace("\\n", "\n"),
            issue_tracker: config.issue_tracker_url,
            kubejs_version: dependencyVersion("kubejs"),
            architectury_version: dependencyVersion("architectury"),
    ]

    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": config.mod_id,
                "Specification-Vendor": config.mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": version,
                "Implementation-Vendor": config.mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "mixins.${config.mod_id}.json"
        ])
    }
}

// Optional: Build number incrementing
import java.nio.file.Files

def incrementBuild = {
    if (rootProject.ext.hasConfig.call("formal_version") && Boolean.parseBoolean(config.formal_version)) {
        def buildTxt = configFile.toPath()
        List<String> lines = Files.readAllLines(buildTxt)
        lines.replaceAll { String ln ->
            if (ln ==~ /\s*version\s*=\s*".*"\s*/) {
                def matcher = (ln =~ /"([^"]+)"/)
                def version = matcher[0][1]
                def dot = version.lastIndexOf('.') + 1
                def newVersion = version.substring(0, dot)
                def lastOne = Integer.parseInt(version.substring(dot)) + 1
                return 'version = "' + newVersion + lastOne + '"'
            }
            return ln
        }
        Files.write(buildTxt, lines, java.nio.file.StandardOpenOption.CREATE)
    }
}

tasks.register("incrementBuildVersion") {
    group "build"
    doLast incrementBuild
}

tasks.build.dependsOn tasks.incrementBuildVersion

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (rootProject.ext.hasConfig.call("maven_url") && !config.maven_url.isEmpty()) {
            maven {
                url config.maven_url
            }
        }
    }
}

def changelogHeadingVersion = { String headingText ->
    headingText.trim().replaceFirst(/^\[([^\]]+)](?:\s*-\s*.*)?$/, '$1').replaceFirst(/^v(?=\d)/, "").trim()
}

def extractVersionChangelog = { String text, String version, String sourceLabel ->
    def lines = text.replace("\r\n", "\n").replace("\r", "\n").split("\n", -1).toList()
    def headingPattern = /^(#{1,6})\s+(.+?)\s*$/
    def start = -1
    def level = 0
    def wanted = version.replaceFirst(/^v(?=\d)/, "")
    lines.eachWithIndex { String line, int index ->
        if (start >= 0) return
        def matcher = line =~ headingPattern
        if (matcher.matches() && changelogHeadingVersion(matcher[0][2]) == wanted) {
            start = index + 1
            level = matcher[0][1].length()
        }
    }
    if (start < 0) {
        throw new GradleException("Could not find changelog section for version ${version} in ${sourceLabel}")
    }
    def end = lines.size()
    for (int index = start; index < lines.size(); index++) {
        def matcher = lines[index] =~ headingPattern
        if (matcher.matches() && matcher[0][1].length() <= level) {
            end = index
            break
        }
    }
    def extracted = lines.subList(start, end).join("\n").trim()
    if (extracted.isBlank()) {
        throw new GradleException("Changelog section for version ${version} in ${sourceLabel} is empty")
    }
    extracted
}

def configuredText = { String inlineText, String relativeFile, String sectionMode, String fallbackText = "" ->
    if (inlineText != null && !inlineText.isBlank()) return inlineText
    if (relativeFile != null && !relativeFile.isBlank()) {
        def source = file(relativeFile)
        if (!source.isFile()) {
            throw new GradleException("Configured publish text file does not exist: ${relativeFile}")
        }
        def text = source.getText("UTF-8")
        return sectionMode == "full" ? text : extractVersionChangelog(text, project.ext.template.finalVersion, relativeFile)
    }
    fallbackText
}

def modrinthChangelogText = configuredText(project.ext.template.publishModrinth.changelog, project.ext.template.publishModrinth.changelogFile, project.ext.template.publishModrinth.changelogSection, "No changelog was specified.")
def curseforgeChangelogText = configuredText(project.ext.template.publishCurseforge.changelog, project.ext.template.publishCurseforge.changelogFile, project.ext.template.publishCurseforge.changelogSection, "")
def runtimeUploadJar = tasks.remapJar.archiveFile

def writeMultipartText = { OutputStream output, String boundary, String name, String value ->
    output.write("--${boundary}\r\n".getBytes("UTF-8"))
    output.write("Content-Disposition: form-data; name=\"${name}\"\r\n\r\n".getBytes("UTF-8"))
    output.write(value.getBytes("UTF-8"))
    output.write("\r\n".getBytes("UTF-8"))
}

def writeMultipartFile = { OutputStream output, String boundary, String name, File file ->
    output.write("--${boundary}\r\n".getBytes("UTF-8"))
    output.write("Content-Disposition: form-data; name=\"${name}\"; filename=\"${file.name}\"\r\n".getBytes("UTF-8"))
    output.write("Content-Type: application/java-archive\r\n\r\n".getBytes("UTF-8"))
    file.withInputStream { input -> input.transferTo(output) }
    output.write("\r\n".getBytes("UTF-8"))
}

tasks.register(modrinthUploadTaskName) {
    group = "upload"
    description = "Uploads the built runtime jar to Modrinth using project.toml settings."
    dependsOn("validateUploadConfiguration")
    dependsOn("remapJar")
    onlyIf { hasModrinthTarget }
    doLast {
        def token = System.env.MODRINTH_TOKEN ?: project.ext.template.modrinthToken ?: ""
        def metadata = [
            project_id    : project.ext.template.modrinthProject,
            version_number: project.ext.template.finalVersion,
            version_title : project.ext.template.publishModrinth.versionName,
            version_type  : project.ext.template.releaseType,
            changelog     : modrinthChangelogText,
            game_versions : project.ext.template.publishModrinth.gameVersions,
            loaders       : project.ext.template.publishModrinth.loaders,
            featured      : false,
            dependencies  : [],
            file_parts    : ["file"]
        ]
        def boundary = "----PickAID${System.currentTimeMillis()}"
        def connection = (HttpURLConnection) new URL("https://api.modrinth.com/v2/version").openConnection()
        connection.setRequestMethod("POST")
        connection.setDoOutput(true)
        connection.setRequestProperty("Authorization", token)
        connection.setRequestProperty("User-Agent", "PickAIDTemplate/1.0")
        connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            writeMultipartText(output, boundary, "data", groovy.json.JsonOutput.toJson(metadata))
            writeMultipartFile(output, boundary, "file", runtimeUploadJar.get().asFile)
            output.write("--${boundary}--\r\n".getBytes("UTF-8"))
        }
        def responseCode = connection.responseCode
        def responseText = responseCode >= 400 ? connection.errorStream?.getText("UTF-8") : connection.inputStream?.getText("UTF-8")
        if (responseCode < 200 || responseCode >= 300) {
            throw new GradleException("Modrinth upload failed with HTTP ${responseCode}: ${responseText ?: ''}")
        }
        logger.lifecycle("Modrinth upload accepted: ${responseText ?: "HTTP ${responseCode}"}")
    }
}

tasks.register(curseforgeUploadTaskName) {
    group = "upload"
    description = "Uploads the built runtime jar to CurseForge using project.toml settings."
    dependsOn("validateUploadConfiguration")
    dependsOn("remapJar")
    onlyIf { hasCurseforgeTarget }
    doLast {
        def token = System.env.CURSEFORGE_TOKEN ?: project.ext.template.curseforgeToken ?: ""
        def metadata = [
            changelog    : curseforgeChangelogText,
            changelogType: project.ext.template.publishCurseforge.changelogType,
            displayName  : project.ext.template.publishCurseforge.displayName,
            gameVersions : project.ext.template.publishCurseforge.gameVersions,
            releaseType  : project.ext.template.releaseType
        ]
        def boundary = "----PickAID${System.currentTimeMillis()}"
        def connection = (HttpURLConnection) new URL("https://minecraft.curseforge.com/api/projects/${project.ext.template.curseforgeProject}/upload-file").openConnection()
        connection.setRequestMethod("POST")
        connection.setDoOutput(true)
        connection.setRequestProperty("X-Api-Token", token)
        connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            writeMultipartText(output, boundary, "metadata", groovy.json.JsonOutput.toJson(metadata))
            writeMultipartFile(output, boundary, "file", runtimeUploadJar.get().asFile)
            output.write("--${boundary}--\r\n".getBytes("UTF-8"))
        }
        def responseCode = connection.responseCode
        def responseText = responseCode >= 400 ? connection.errorStream?.getText("UTF-8") : connection.inputStream?.getText("UTF-8")
        if (responseCode < 200 || responseCode >= 300) {
            throw new GradleException("CurseForge upload failed with HTTP ${responseCode}: ${responseText ?: ''}")
        }
        logger.lifecycle("CurseForge upload accepted: ${responseText ?: "HTTP ${responseCode}"}")
    }
}

def validateUploadConfiguration = tasks.register('validateUploadConfiguration') {
    group = "upload"
    doLast {
        modrinthChangelogText
        curseforgeChangelogText
        if (!hasModrinthTarget && !hasCurseforgeTarget) {
            throw new GradleException("At least one upload platform must be configured")
        }
        if (!(project.ext.template.releaseType in ["alpha", "beta", "release"])) {
            throw new GradleException("release_type must be one of alpha, beta, release")
        }
    }
}

tasks.register('buildAndUploadMod') {
    group = "upload"
    dependsOn validateUploadConfiguration
    if (hasModrinthTarget) dependsOn modrinthUploadTaskName
    if (hasCurseforgeTarget) dependsOn curseforgeUploadTaskName
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(17)
}
